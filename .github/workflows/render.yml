name: Render Emu War Video
on: [workflow_dispatch]
jobs:
  render:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2
      - name: Install Remotion & 3D Engine
        run: |
          npm init -y
          npm install remotion@4.0.234 @remotion/cli@4.0.234 @remotion/three@4.0.234 three @types/three @react-three/fiber@8.17.10 @react-three/drei@9.114.3 react@18.3.1 react-dom@18.3.1
      - name: Build 2D-3D Hybrid Engine
        run: |
          mkdir -p public src
          AUDIO=$(ls *.mp3 *.wav *.m4a 2>/dev/null | head -n 1)
          if [ -n "$AUDIO" ]; then cp "$AUDIO" public/voice.mp3; fi
          JSONF=$(ls *.json 2>/dev/null | grep -v "package" | head -n 1)
          if [ -n "$JSONF" ]; then cp "$JSONF" src/timings.json; else echo "{}" > src/timings.json; fi

          cat << 'EOF' > src/index.ts
          import { registerRoot } from "remotion";
          import { Root } from "./Root";
          registerRoot(Root);
          EOF

          cat << 'EOF' > src/Root.tsx
          import React from "react";
          import { Composition } from "remotion";
          import { EmuWar } from "./EmuWar";
          export const Root: React.FC = () => (
            <Composition id="EmuWar" component={EmuWar} durationInFrames={1050} fps={30} width={1080} height={1920} />
          );
          EOF

          cat << 'EOF' > src/textures.ts
          import * as THREE from "three";

          function makeCanvas(w: number, h: number, draw: (ctx: CanvasRenderingContext2D) => void): THREE.CanvasTexture {
            const c = document.createElement("canvas");
            c.width = w;
            c.height = h;
            const ctx = c.getContext("2d")!;
            draw(ctx);
            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.needsUpdate = true;
            return tex;
          }

          export function createEmuTexture(phase: number, panic: boolean): THREE.CanvasTexture {
            return makeCanvas(512, 512, (ctx) => {
              ctx.clearRect(0, 0, 512, 512);
              const legA = Math.sin(phase) * 0.45;
              const legB = -Math.sin(phase) * 0.45;
              const bounce = Math.abs(Math.sin(phase)) * 18;
              ctx.save();
              ctx.translate(240, 290 - bounce);

              // Shadow
              ctx.fillStyle = "rgba(36, 23, 38, 0.25)";
              ctx.beginPath();
              ctx.ellipse(0, 175 + bounce, 95, 22, 0, 0, Math.PI * 2);
              ctx.fill();

              // Back Leg
              ctx.save();
              ctx.translate(-15, 55);
              ctx.rotate(legB);
              ctx.strokeStyle = "#241726";
              ctx.lineWidth = 18;
              ctx.lineCap = "round";
              ctx.beginPath();
              ctx.moveTo(0, 0); ctx.lineTo(-18, 60); ctx.lineTo(14, 115); ctx.lineTo(44, 115);
              ctx.stroke();
              ctx.strokeStyle = "#d9822b";
              ctx.lineWidth = 8;
              ctx.stroke();
              ctx.restore();

              // Tail Feathers
              ctx.fillStyle = "#463529";
              ctx.strokeStyle = "#241726";
              ctx.lineWidth = 12;
              ctx.lineJoin = "round";
              ctx.beginPath();
              ctx.moveTo(-95, -5); ctx.lineTo(-155, -35); ctx.lineTo(-135, 5); ctx.lineTo(-162, 32); ctx.lineTo(-92, 38);
              ctx.closePath();
              ctx.fill(); ctx.stroke();

              // Bean Body with Plum Outline
              ctx.fillStyle = "#614b3c";
              ctx.beginPath();
              ctx.ellipse(0, 10, 105, 76, -0.08, 0, Math.PI * 2);
              ctx.fill(); ctx.stroke();

              // Wing Feather Shading
              ctx.fillStyle = "#7d624f";
              ctx.beginPath();
              ctx.ellipse(-10, 4, 72, 44, -0.15, 0, Math.PI * 2);
              ctx.fill();

              // Long Neck & Bean Head
              ctx.save();
              ctx.translate(72, -25);
              ctx.rotate(Math.sin(phase) * 0.12);
              ctx.strokeStyle = "#241726";
              ctx.lineWidth = 38;
              ctx.lineCap = "round";
              ctx.beginPath();
              ctx.moveTo(0, 15); ctx.quadraticCurveTo(26, -65, 14, -135);
              ctx.stroke();
              ctx.strokeStyle = "#6f8296";
              ctx.lineWidth = 20;
              ctx.stroke();

              // Head
              ctx.fillStyle = "#614b3c";
              ctx.strokeStyle = "#241726";
              ctx.lineWidth = 12;
              ctx.beginPath();
              ctx.ellipse(20, -148, 42, 35, 0.1, 0, Math.PI * 2);
              ctx.fill(); ctx.stroke();

              // Beak
              ctx.fillStyle = "#f5a623";
              ctx.beginPath();
              ctx.moveTo(56, -155); ctx.lineTo(106, -140); ctx.lineTo(56, -126);
              ctx.closePath();
              ctx.fill(); ctx.stroke();

              // Expressive Eye
              ctx.fillStyle = "#ffffff";
              ctx.beginPath();
              ctx.arc(32, -154, panic ? 16 : 13, 0, Math.PI * 2);
              ctx.fill(); ctx.stroke();
              ctx.fillStyle = "#241726";
              ctx.beginPath();
              ctx.arc(panic ? 36 : 35, -154, 6, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();

              // Front Leg
              ctx.save();
              ctx.translate(18, 55);
              ctx.rotate(legA);
              ctx.strokeStyle = "#241726";
              ctx.lineWidth = 18;
              ctx.lineCap = "round";
              ctx.beginPath();
              ctx.moveTo(0, 0); ctx.lineTo(-18, 60); ctx.lineTo(14, 115); ctx.lineTo(44, 115);
              ctx.stroke();
              ctx.strokeStyle = "#f5a623";
              ctx.lineWidth = 8;
              ctx.stroke();
              ctx.restore();

              ctx.restore();
            });
          }

          export function createSoldierTexture(phase: number, firing: boolean, retreating: boolean): THREE.CanvasTexture {
            return makeCanvas(512, 512, (ctx) => {
              ctx.clearRect(0, 0, 512, 512);
              const bounce = retreating ? Math.abs(Math.sin(phase)) * 20 : (firing ? Math.abs(Math.sin(phase * 3)) * 6 : 0);
              const legSwing = retreating ? Math.sin(phase) * 0.5 : 0;

              ctx.save();
              ctx.translate(230, 290 - bounce);
              if (retreating) ctx.scale(-1, 1);

              // Shadow
              ctx.fillStyle = "rgba(36, 23, 38, 0.28)";
              ctx.beginPath();
              ctx.ellipse(0, 175 + bounce, 85, 20, 0, 0, Math.PI * 2);
              ctx.fill();

              // Legs
              [-22, 22].forEach((lx, idx) => {
                ctx.save();
                ctx.translate(lx, 85);
                ctx.rotate(idx === 0 ? legSwing : -legSwing);
                ctx.strokeStyle = "#241726";
                ctx.lineWidth = 24;
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(0, 0); ctx.lineTo(0, 82); ctx.lineTo(18, 82);
                ctx.stroke();
                ctx.strokeStyle = "#4d3826";
                ctx.lineWidth = 10;
                ctx.stroke();
                ctx.restore();
              });

              // Bean Character Body
              ctx.fillStyle = "#738254";
              ctx.strokeStyle = "#241726";
              ctx.lineWidth = 13;
              ctx.beginPath();
              ctx.roundRect(-62, -95, 124, 195, 62);
              ctx.fill(); ctx.stroke();

              // Belt & Pouches
              ctx.fillStyle = "#4a3525";
              ctx.fillRect(-58, 22, 116, 24);
              ctx.strokeRect(-58, 22, 116, 24);

              // Expressive Eyes & Brow
              ctx.fillStyle = "#ffffff";
              ctx.beginPath();
              ctx.arc(24, -40, 15, 0, Math.PI * 2);
              ctx.fill(); ctx.stroke();
              ctx.fillStyle = "#241726";
              ctx.beginPath();
              ctx.arc(28, -40, 7, 0, Math.PI * 2);
              ctx.fill();
              ctx.beginPath();
              ctx.moveTo(8, -62); ctx.lineTo(42, -52);
              ctx.lineWidth = 9;
              ctx.stroke();

              // Australian Slouch Hat
              ctx.fillStyle = "#55613e";
              ctx.lineWidth = 12;
              ctx.beginPath();
              ctx.ellipse(0, -90, 96, 18, -0.06, 0, Math.PI * 2);
              ctx.fill(); ctx.stroke();
              ctx.beginPath();
              ctx.moveTo(-52, -92); ctx.quadraticCurveTo(0, -152, 52, -92);
              ctx.closePath();
              ctx.fill(); ctx.stroke();

              // Lewis Machine Gun & Muzzle Flash
              if (!retreating) {
                const recoil = firing ? (Math.sin(phase * 4) * 8) : 0;
                ctx.save();
                ctx.translate(30 - recoil, 15);
                // Bipod
                ctx.strokeStyle = "#241726";
                ctx.lineWidth = 11;
                ctx.beginPath();
                ctx.moveTo(75, 15); ctx.lineTo(48, 155);
                ctx.moveTo(75, 15); ctx.lineTo(105, 155);
                ctx.stroke();
                // Barrel & Pan Magazine
                ctx.fillStyle = "#393e46";
                ctx.fillRect(-20, -14, 130, 30);
                ctx.strokeRect(-20, -14, 130, 30);
                ctx.fillStyle = "#68707d";
                ctx.beginPath();
                ctx.ellipse(42, -22, 34, 11, 0, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();

                if (firing && Math.sin(phase * 4) > 0) {
                  ctx.fillStyle = "#ffd54f";
                  ctx.strokeStyle = "#ff6f00";
                  ctx.lineWidth = 6;
                  ctx.beginPath();
                  ctx.moveTo(118, -28); ctx.lineTo(195, 2); ctx.lineTo(118, 32); ctx.lineTo(142, 2);
                  ctx.closePath();
                  ctx.fill(); ctx.stroke();
                }
                ctx.restore();
              }

              ctx.restore();
            });
          }
          EOF

          cat << 'EOF' > src/EmuWar.tsx
          import React, { useMemo, useRef, useEffect } from "react";
          import { AbsoluteFill, Audio, staticFile, useCurrentFrame, useVideoConfig, interpolate } from "remotion";
          import { ThreeCanvas } from "@remotion/three";
          import { useFrame, useThree } from "@react-three/fiber";
          import * as THREE from "three";
          import { createEmuTexture, createSoldierTexture } from "./textures";
          import rawTimings from "./timings.json";

          const CameraRig: React.FC<{ frame: number }> = ({ frame }) => {
            const { camera } = useThree();
            useFrame(() => {
              let cx = 0, cy = 2.4, cz = 9.5;
              let tx = 0, ty = 1.0, tz = -2.0;

              if (frame < 240) {
                // Scene 1: Sweeping crane down & follow tracking across 3D wheat field
                const p = frame / 240;
                cx = interpolate(p, [0, 1], [-4.5, 3.8]);
                cy = interpolate(p, [0, 1], [5.8, 2.2]);
                cz = interpolate(p, [0, 1], [12.5, 8.2]);
                tx = interpolate(p, [0, 1], [-2.0, 2.5]);
                ty = 1.1;
                tz = -2.5;
              } else if (frame < 540) {
                // Scene 2: Over-the-shoulder artillery tracking + recoil shake
                const p = (frame - 240) / 300;
                const shake = (frame % 4 < 2) ? 0.14 : -0.14;
                cx = interpolate(p, [0, 1], [-4.2, -2.6]) + shake;
                cy = 2.1 + Math.abs(shake) * 0.5;
                cz = interpolate(p, [0, 1], [7.8, 6.2]);
                tx = 2.2;
                ty = 1.2;
                tz = -3.0;
              } else if (frame < 810) {
                // Scene 3: Fast low-angle lateral camera track following sprinting emu squads
                const p = (frame - 540) / 270;
                cx = interpolate(p, [0, 1], [-5.5, 5.5]);
                cy = 1.55 + Math.sin(frame * 0.25) * 0.08;
                cz = 7.4;
                tx = cx + 1.2;
                ty = 1.1;
                tz = -2.5;
              } else {
                // Scene 4: Sunset dramatic orbit pull-back
                const p = (frame - 810) / 240;
                const angle = interpolate(p, [0, 1], [-0.35, 0.45]);
                const radius = interpolate(p, [0, 1], [8.5, 12.0]);
                cx = Math.sin(angle) * radius;
                cy = interpolate(p, [0, 1], [2.2, 4.2]);
                cz = Math.cos(angle) * radius;
                tx = 0.5;
                ty = 1.2;
                tz = -2.0;
              }

              camera.position.set(cx, cy, cz);
              camera.lookAt(tx, ty, tz);
            });
            return null;
          };

          const WheatField3D: React.FC<{ frame: number }> = ({ frame }) => {
            const meshRef = useRef<THREE.InstancedMesh>(null);
            const count = 420;
            const dummy = useMemo(() => new THREE.Object3D(), []);
            const stalks = useMemo(() => Array.from({ length: count }, (_, i) => ({
              x: ((i * 97) % 240) / 10 - 12,
              z: -((i * 53) % 200) / 10 + 4,
              h: 0.9 + (i % 5) * 0.25,
              phase: i * 0.4
            })), []);

            useEffect(() => {
              if (!meshRef.current) return;
              stalks.forEach((s, i) => {
                dummy.position.set(s.x, s.h * 0.5, s.z);
                dummy.rotation.z = Math.sin(frame * 0.09 + s.phase) * 0.22;
                dummy.rotation.x = Math.cos(frame * 0.07 + s.phase) * 0.1;
                dummy.scale.set(0.09, s.h, 0.09);
                dummy.updateMatrix();
                meshRef.current!.setMatrixAt(i, dummy.matrix);
              });
              meshRef.current.instanceMatrix.needsUpdate = true;
            }, [frame, dummy, stalks]);

            return (
              <instancedMesh ref={meshRef} args={[undefined, undefined, count]}>
                <coneGeometry args={[0.5, 1, 5]} />
                <meshToonMaterial color="#f0c14b" />
              </instancedMesh>
            );
          };

          const CharacterBillboard: React.FC<{ texture: THREE.Texture; position: [number, number, number]; scale?: number; flipX?: boolean }> = ({ texture, position, scale = 3.2, flipX = false }) => {
            const meshRef = useRef<THREE.Mesh>(null);
            useFrame(({ camera }) => {
              if (meshRef.current) {
                meshRef.current.quaternion.copy(camera.quaternion);
              }
            });
            return (
              <mesh ref={meshRef} position={position} scale={[flipX ? -scale : scale, scale, 1]}>
                <planeGeometry args={[1, 1]} />
                <meshBasicMaterial map={texture} transparent alphaTest={0.05} side={THREE.DoubleSide} />
              </mesh>
            );
          };

          export const EmuWar: React.FC = () => {
            const frame = useCurrentFrame();
            const { width, height } = useVideoConfig();
            const scene = frame < 240 ? 1 : frame < 540 ? 2 : frame < 810 ? 3 : 4;

            const emuTexA = useMemo(() => createEmuTexture(frame * 0.35, scene === 2), [frame, scene]);
            const emuTexB = useMemo(() => createEmuTexture(frame * 0.35 + 1.8, scene === 2), [frame, scene]);
            const soldierTex = useMemo(() => createSoldierTexture(frame * 0.35, scene === 2, scene === 4), [frame, scene]);

            let dynamicCaption = "";
            const data: any = rawTimings;
            const tSec = frame / 30;
            if (Array.isArray(data?.word_timestamps?.words)) {
              const words = data.word_timestamps.words.filter((w: any) => w.start <= tSec + 0.2 && w.end >= tSec - 1.8);
              dynamicCaption = words.slice(-6).map((w: any) => w.word).join(" ");
            } else if (Array.isArray(data?.segments)) {
              const seg = data.segments.find((s: any) => tSec >= s.start && tSec <= s.end);
              if (seg) dynamicCaption = seg.text;
            }

            const titles: Record<number, { top: string; sub: string }> = {
              1: { top: "1932: WESTERN AUSTRALIA", sub: "20,000 Emus Invade the Wheat Fields" },
              2: { top: "ROYAL ARTILLERY DEPLOYS", sub: "Lewis Machine Guns vs. Flightless Birds" },
              3: { top: "GUERRILLA EMU TACTICS", sub: "Splitting Into Squads at 50 km/h" },
              4: { top: "VICTORY: THE EMUS", sub: "The Australian Army Retreats" },
            };

            const emuX1 = interpolate(frame % 160, [0, 160], [-7.5, 7.5]);
            const emuSplitZ = scene === 3 ? interpolate(frame, [540, 810], [-2.0, -7.5]) : -2.2;
            const emuSplitZ2 = scene === 3 ? interpolate(frame, [540, 810], [-1.5, 2.5]) : -0.8;
            const retreatX = scene === 4 ? interpolate(frame, [810, 1050], [-2.2, -9.5]) : -2.6;

            return (
              <AbsoluteFill style={{ backgroundColor: scene === 4 ? "#e87a5d" : "#2f7ed8" }}>
                <ThreeCanvas width={width} height={height} camera={{ fov: 45, near: 0.1, far: 100 }}>
                  <CameraRig frame={frame} />
                  <color attach="background" args={[scene === 4 ? "#f28b66" : "#4ea1f3"]} />
                  <fog attach="fog" args={[scene === 4 ? "#fbc299" : "#9bd0ff", 10, 32]} />
                  <ambientLight intensity={0.85} color="#fff6e0" />
                  <directionalLight position={[8, 14, 6]} intensity={1.7} color="#ffe9b3" />

                  {/* 3D Golden Terrain */}
                  <mesh rotation={[-Math.PI / 2, 0, 0]} position={[0, 0, -4]}>
                    <planeGeometry args={[60, 60]} />
                    <meshToonMaterial color="#c98e2b" />
                  </mesh>

                  {/* 3D Distant Painted Hills */}
                  <mesh position={[-8, 1.2, -18]}>
                    <sphereGeometry args={[7, 24, 16]} />
                    <meshToonMaterial color="#5870a6" />
                  </mesh>
                  <mesh position={[7, 1.6, -20]}>
                    <sphereGeometry args={[8.5, 24, 16]} />
                    <meshToonMaterial color="#465c8f" />
                  </mesh>

                  {/* 3D Wooden Fence Posts */}
                  {[-6, -3, 0, 3, 6].map((fx, i) => (
                    <group key={i} position={[fx, 0.7, -5.5]}>
                      <mesh>
                        <boxGeometry args={[0.18, 1.4, 0.18]} />
                        <meshToonMaterial color="#5e3c24" />
                      </mesh>
                      <mesh position={[1.5, 0.25, 0]}>
                        <boxGeometry args={[3.0, 0.12, 0.1]} />
                        <meshToonMaterial color="#70482b" />
                      </mesh>
                    </group>
                  ))}

                  <WheatField3D frame={frame} />

                  {/* Characters in 3D Space */}
                  {scene === 1 && (
                    <>
                      <CharacterBillboard texture={emuTexA} position={[emuX1, 1.55, -2.0]} scale={3.3} />
                      <CharacterBillboard texture={emuTexB} position={[emuX1 - 2.4, 1.5, -3.5]} scale={3.1} />
                      <CharacterBillboard texture={emuTexA} position={[emuX1 - 4.2, 1.6, -0.8]} scale={3.5} />
                    </>
                  )}

                  {scene === 2 && (
                    <>
                      <CharacterBillboard texture={soldierTex} position={[-2.6, 1.55, 1.2]} scale={3.4} />
                      <CharacterBillboard texture={soldierTex} position={[-1.4, 1.55, -1.2]} scale={3.2} />
                      <CharacterBillboard texture={emuTexA} position={[3.6, 1.55, -1.5]} scale={3.3} flipX />
                      <CharacterBillboard texture={emuTexB} position={[5.2, 1.55, -3.4]} scale={3.2} flipX />
                    </>
                  )}

                  {scene === 3 && (
                    <>
                      <CharacterBillboard texture={emuTexA} position={[emuX1, 1.55, emuSplitZ]} scale={3.2} />
                      <CharacterBillboard texture={emuTexB} position={[emuX1 - 2.0, 1.55, emuSplitZ2]} scale={3.5} />
                      <CharacterBillboard texture={emuTexA} position={[emuX1 - 3.8, 1.55, -2.4]} scale={3.3} />
                    </>
                  )}

                  {scene === 4 && (
                    <>
                      <CharacterBillboard texture={soldierTex} position={[retreatX, 1.55, 0.5]} scale={3.3} />
                      <CharacterBillboard texture={emuTexA} position={[2.2, 1.6, -1.2]} scale={3.5} flipX />
                      <CharacterBillboard texture={emuTexB} position={[4.2, 1.6, -2.8]} scale={3.4} flipX />
                    </>
                  )}
                </ThreeCanvas>

                {/* Top Banner */}
                <div style={{ position: "absolute", top: 130, width: "100%", textAlign: "center", padding: "0 40px", fontFamily: "sans-serif" }}>
                  <div style={{ display: "inline-block", background: "#241726", color: "#ffd54f", padding: "14px 32px", borderRadius: 20, fontSize: 38, fontWeight: 900, letterSpacing: 2, boxShadow: "0 8px 20px rgba(0,0,0,0.4)" }}>
                    {titles[scene].top}
                  </div>
                  <div style={{ marginTop: 16, color: "#ffffff", fontSize: 32, fontWeight: 800, textShadow: "0 3px 12px #241726" }}>
                    {titles[scene].sub}
                  </div>
                </div>

                {/* Live Synced Captions */}
                {dynamicCaption && (
                  <div style={{ position: "absolute", bottom: 220, width: "100%", textAlign: "center", padding: "0 50px", fontFamily: "sans-serif" }}>
                    <span style={{ background: "rgba(36, 23, 38, 0.88)", color: "#ffffff", padding: "14px 28px", borderRadius: 16, fontSize: 40, fontWeight: 900, lineHeight: 1.4 }}>
                      {dynamicCaption}
                    </span>
                  </div>
                )}

                <Audio src={staticFile("voice.mp3")} />
              </AbsoluteFill>
            );
          };
          EOF

      - name: Render Video
        run: npx remotion render src/index.ts EmuWar final_emu_war.mp4 --gl=swiftshader --concurrency=2 --crf=22
      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: final-emu-war-video
          path: final_emu_war.mp4

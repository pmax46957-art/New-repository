name: Render Emu War Video
on: [workflow_dispatch]
jobs:
  render:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2
      - name: Install Remotion & 3D Engine
        run: |
          npm init -y
          npm install remotion@4.0.234 @remotion/cli@4.0.234 @remotion/three@4.0.234 three @types/three @react-three/fiber@8.17.10 @react-three/drei@9.114.3 react@18.3.1 react-dom@18.3.1
      - name: Build Beat-Synced 2D-3D Hybrid Engine
        run: |
          mkdir -p public src
          AUDIO=$(ls *.mp3 *.wav *.m4a 2>/dev/null | head -n 1)
          if [ -n "$AUDIO" ]; then cp "$AUDIO" public/voice.mp3; fi
          JSONF=$(ls *.json 2>/dev/null | grep -v "package" | head -n 1)
          if [ -n "$JSONF" ]; then cp "$JSONF" src/timings.json; else echo "{}" > src/timings.json; fi

          cat << 'EOF' > src/index.ts
          import { registerRoot } from "remotion";
          import { Root } from "./Root";
          registerRoot(Root);
          EOF

          cat << 'EOF' > src/Root.tsx
          import React from "react";
          import { Composition } from "remotion";
          import { EmuWar } from "./EmuWar";
          export const Root: React.FC = () => (
            <Composition id="EmuWar" component={EmuWar} durationInFrames={1050} fps={30} width={1080} height={1920} />
          );
          EOF

          cat << 'EOF' > src/textures.ts
          import * as THREE from "three";

          function makeCanvas(w: number, h: number, draw: (ctx: CanvasRenderingContext2D) => void): THREE.CanvasTexture {
            const c = document.createElement("canvas");
            c.width = w;
            c.height = h;
            const ctx = c.getContext("2d")!;
            draw(ctx);
            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.needsUpdate = true;
            return tex;
          }

          export function createPaintedBackdrop(isSunset: boolean): THREE.CanvasTexture {
            return makeCanvas(1024, 512, (ctx) => {
              const sky = ctx.createLinearGradient(0, 0, 0, 512);
              if (isSunset) {
                sky.addColorStop(0, "#2b2d5c");
                sky.addColorStop(0.45, "#d96b43");
                sky.addColorStop(0.85, "#f7b267");
                sky.addColorStop(1, "#ffe599");
              } else {
                sky.addColorStop(0, "#1d5fa3");
                sky.addColorStop(0.55, "#5ca9f5");
                sky.addColorStop(0.9, "#bfe3ff");
                sky.addColorStop(1, "#fff4cc");
              }
              ctx.fillStyle = sky;
              ctx.fillRect(0, 0, 1024, 512);

              // Sun Glow
              const sunY = isSunset ? 330 : 150;
              const glow = ctx.createRadialGradient(780, sunY, 15, 780, sunY, 160);
              glow.addColorStop(0, "rgba(255, 250, 210, 0.95)");
              glow.addColorStop(0.4, "rgba(255, 220, 130, 0.45)");
              glow.addColorStop(1, "rgba(255, 220, 130, 0)");
              ctx.fillStyle = glow;
              ctx.fillRect(0, 0, 1024, 512);

              // Stylized Painted Clouds
              ctx.fillStyle = isSunset ? "rgba(255, 210, 175, 0.65)" : "rgba(255, 255, 255, 0.78)";
              [[180, 110, 75], [240, 100, 90], [310, 115, 65], [620, 140, 60], [680, 132, 80], [740, 145, 55]].forEach(([cx, cy, r]) => {
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fill();
              });

              // Distant Mountain Ranges
              ctx.fillStyle = isSunset ? "#543b5c" : "#5674ab";
              ctx.beginPath();
              ctx.moveTo(0, 512); ctx.lineTo(0, 350);
              ctx.quadraticCurveTo(180, 240, 380, 340);
              ctx.quadraticCurveTo(600, 220, 820, 330);
              ctx.quadraticCurveTo(940, 280, 1024, 340);
              ctx.lineTo(1024, 512);
              ctx.fill();

              ctx.fillStyle = isSunset ? "#3b2842" : "#3f5a8c";
              ctx.beginPath();
              ctx.moveTo(0, 512); ctx.lineTo(0, 390);
              ctx.quadraticCurveTo(260, 310, 520, 385);
              ctx.quadraticCurveTo(790, 290, 1024, 380);
              ctx.lineTo(1024, 512);
              ctx.fill();
            });
          }

          export function createEmuTexture(step: number, mode: "run" | "panic" | "smug"): THREE.CanvasTexture {
            return makeCanvas(420, 420, (ctx) => {
              const phase = step * (Math.PI / 4);
              const isMoving = mode !== "smug";
              const legA = isMoving ? Math.sin(phase) * 0.52 : 0.05;
              const legB = isMoving ? -Math.sin(phase) * 0.52 : -0.05;
              const bounce = isMoving ? Math.abs(Math.sin(phase)) * 18 : Math.sin(phase) * 4;
              const stretchY = isMoving ? 1 + Math.sin(phase * 2) * 0.06 : 1;

              ctx.save();
              ctx.translate(200, 235 - bounce);

              // Ground Contact Shadow
              ctx.fillStyle = "rgba(36, 23, 38, 0.3)";
              ctx.beginPath();
              ctx.ellipse(0, 145 + bounce, 78, 18, 0, 0, Math.PI * 2);
              ctx.fill();

              // Back Leg
              ctx.save();
              ctx.translate(-14, 42);
              ctx.rotate(legB);
              ctx.strokeStyle = "#241726";
              ctx.lineWidth = 15;
              ctx.lineCap = "round";
              ctx.beginPath();
              ctx.moveTo(0, 0); ctx.lineTo(-16, 48); ctx.lineTo(12, 95); ctx.lineTo(36, 95);
              ctx.stroke();
              ctx.strokeStyle = "#d9822b";
              ctx.lineWidth = 6;
              ctx.stroke();
              ctx.restore();

              // Tail Feathers
              ctx.fillStyle = "#463529";
              ctx.strokeStyle = "#241726";
              ctx.lineWidth = 10;
              ctx.lineJoin = "round";
              ctx.beginPath();
              ctx.moveTo(-75, -6); ctx.lineTo(-128, -32); ctx.lineTo(-110, 4); ctx.lineTo(-134, 28); ctx.lineTo(-72, 32);
              ctx.closePath();
              ctx.fill(); ctx.stroke();

              // Feathered Bean Body with Squash & Stretch
              ctx.save();
              ctx.scale(2 - stretchY, stretchY);
              ctx.fillStyle = "#614b3c";
              ctx.beginPath();
              ctx.ellipse(0, 8, 86, 62, -0.08, 0, Math.PI * 2);
              ctx.fill(); ctx.stroke();

              // Highlight Feather Layer
              ctx.fillStyle = "#806450";
              ctx.beginPath();
              ctx.ellipse(-8, 2, 58, 36, -0.15, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();

              // Neck & Bean Head
              ctx.save();
              ctx.translate(60, -20);
              ctx.rotate(isMoving ? Math.sin(phase) * 0.14 : Math.sin(phase) * 0.05);
              ctx.strokeStyle = "#241726";
              ctx.lineWidth = 30;
              ctx.lineCap = "round";
              ctx.beginPath();
              ctx.moveTo(0, 12); ctx.quadraticCurveTo(22, -52, 12, -108);
              ctx.stroke();
              ctx.strokeStyle = "#6f8296";
              ctx.lineWidth = 16;
              ctx.stroke();

              // Head
              ctx.fillStyle = "#614b3c";
              ctx.strokeStyle = "#241726";
              ctx.lineWidth = 10;
              ctx.beginPath();
              ctx.ellipse(16, -120, 34, 29, 0.1, 0, Math.PI * 2);
              ctx.fill(); ctx.stroke();

              // Beak
              ctx.fillStyle = "#f5a623";
              ctx.beginPath();
              ctx.moveTo(46, -126); ctx.lineTo(86, -114); ctx.lineTo(46, -102);
              ctx.closePath();
              ctx.fill(); ctx.stroke();

              // Expressive Eye (Panic vs Smug vs Normal)
              ctx.fillStyle = "#ffffff";
              ctx.beginPath();
              ctx.arc(26, -125, mode === "panic" ? 14 : 11, 0, Math.PI * 2);
              ctx.fill(); ctx.stroke();
              ctx.fillStyle = "#241726";
              ctx.beginPath();
              ctx.arc(mode === "panic" ? 30 : 28, -125, 5, 0, Math.PI * 2);
              ctx.fill();
              if (mode === "smug") {
                ctx.fillStyle = "#614b3c";
                ctx.fillRect(14, -138, 26, 10);
                ctx.beginPath();
                ctx.moveTo(14, -128); ctx.lineTo(40, -128);
                ctx.lineWidth = 5;
                ctx.stroke();
              }
              ctx.restore();

              // Front Leg
              ctx.save();
              ctx.translate(16, 42);
              ctx.rotate(legA);
              ctx.strokeStyle = "#241726";
              ctx.lineWidth = 15;
              ctx.lineCap = "round";
              ctx.beginPath();
              ctx.moveTo(0, 0); ctx.lineTo(-16, 48); ctx.lineTo(12, 95); ctx.lineTo(36, 95);
              ctx.stroke();
              ctx.strokeStyle = "#f5a623";
              ctx.lineWidth = 6;
              ctx.stroke();
              ctx.restore();

              ctx.restore();
            });
          }

          export function createSoldierTexture(step: number, mode: "aim" | "fire" | "retreat"): THREE.CanvasTexture {
            return makeCanvas(420, 420, (ctx) => {
              const phase = step * (Math.PI / 4);
              const retreating = mode === "retreat";
              const firing = mode === "fire";
              const bounce = retreating ? Math.abs(Math.sin(phase)) * 18 : (firing ? (step % 2) * 5 : Math.sin(phase) * 2);
              const legSwing = retreating ? Math.sin(phase) * 0.55 : 0;

              ctx.save();
              ctx.translate(190, 235 - bounce);
              if (retreating) ctx.scale(-1, 1);

              // Shadow
              ctx.fillStyle = "rgba(36, 23, 38, 0.3)";
              ctx.beginPath();
              ctx.ellipse(0, 145 + bounce, 72, 16, 0, 0, Math.PI * 2);
              ctx.fill();

              // Legs
              [-18, 18].forEach((lx, idx) => {
                ctx.save();
                ctx.translate(lx, 70);
                ctx.rotate(idx === 0 ? legSwing : -legSwing);
                ctx.strokeStyle = "#241726";
                ctx.lineWidth = 20;
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(0, 0); ctx.lineTo(0, 70); ctx.lineTo(16, 70);
                ctx.stroke();
                ctx.strokeStyle = "#4d3826";
                ctx.lineWidth = 9;
                ctx.stroke();
                ctx.restore();
              });

              // Bean Character Body
              ctx.fillStyle = "#738254";
              ctx.strokeStyle = "#241726";
              ctx.lineWidth = 11;
              ctx.beginPath();
              ctx.roundRect(-52, -78, 104, 162, 52);
              ctx.fill(); ctx.stroke();

              // Belt & Webbing
              ctx.fillStyle = "#4a3525";
              ctx.fillRect(-49, 18, 98, 20);
              ctx.strokeRect(-49, 18, 98, 20);

              // Expressive Eye & Brow
              ctx.fillStyle = "#ffffff";
              ctx.beginPath();
              ctx.arc(20, -34, retreating ? 15 : 12, 0, Math.PI * 2);
              ctx.fill(); ctx.stroke();
              ctx.fillStyle = "#241726";
              ctx.beginPath();
              ctx.arc(retreating ? 24 : 23, -34, 5.5, 0, Math.PI * 2);
              ctx.fill();
              ctx.beginPath();
              if (retreating) {
                ctx.moveTo(6, -54); ctx.lineTo(34, -48);
              } else {
                ctx.moveTo(6, -50); ctx.lineTo(35, -42);
              }
              ctx.lineWidth = 8;
              ctx.stroke();

              // Australian Slouch Hat
              ctx.fillStyle = "#55613e";
              ctx.lineWidth = 10;
              ctx.beginPath();
              ctx.ellipse(0, -76, 80, 16, -0.06, 0, Math.PI * 2);
              ctx.fill(); ctx.stroke();
              ctx.beginPath();
              ctx.moveTo(-42, -78); ctx.quadraticCurveTo(0, -126, 42, -78);
              ctx.closePath();
              ctx.fill(); ctx.stroke();

              // Lewis Machine Gun
              if (!retreating) {
                const recoil = firing ? (step % 2) * 8 : 0;
                ctx.save();
                ctx.translate(24 - recoil, 14);
                ctx.strokeStyle = "#241726";
                ctx.lineWidth = 9;
                ctx.beginPath();
                ctx.moveTo(62, 14); ctx.lineTo(40, 128);
                ctx.moveTo(62, 14); ctx.lineTo(86, 128);
                ctx.stroke();
                ctx.fillStyle = "#393e46";
                ctx.fillRect(-16, -12, 106, 25);
                ctx.strokeRect(-16, -12, 106, 25);
                ctx.fillStyle = "#68707d";
                ctx.beginPath();
                ctx.ellipse(36, -18, 28, 9, 0, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();

                if (firing && step % 2 === 0) {
                  ctx.fillStyle = "#ffd54f";
                  ctx.strokeStyle = "#ff6f00";
                  ctx.lineWidth = 5;
                  ctx.beginPath();
                  ctx.moveTo(98, -24); ctx.lineTo(165, 2); ctx.lineTo(98, 28); ctx.lineTo(118, 2);
                  ctx.closePath();
                  ctx.fill(); ctx.stroke();
                }
                ctx.restore();
              }

              ctx.restore();
            });
          }
          EOF

          cat << 'EOF' > src/EmuWar.tsx
          import React, { useMemo, useRef, useEffect } from "react";
          import { AbsoluteFill, Audio, staticFile, useCurrentFrame, useVideoConfig, interpolate, spring } from "remotion";
          import { ThreeCanvas } from "@remotion/three";
          import { useFrame, useThree } from "@react-three/fiber";
          import * as THREE from "three";
          import { createEmuTexture, createSoldierTexture, createPaintedBackdrop } from "./textures";
          import rawTimings from "./timings.json";

          interface BeatSegment {
            start: number;
            end: number;
            text: string;
          }

          function extractBeatSegments(data: any): BeatSegment[] {
            if (Array.isArray(data?.segments) && data.segments.length > 0) {
              return data.segments.map((s: any) => ({ start: Number(s.start) || 0, end: Number(s.end) || 35, text: String(s.text || "").trim() }));
            }
            const words = data?.word_timestamps?.words || data?.words;
            if (Array.isArray(words) && words.length > 0) {
              const out: BeatSegment[] = [];
              let chunk: any[] = [];
              words.forEach((w: any, idx: number) => {
                chunk.push(w);
                const wordStr = String(w.word || w.text || "");
                const isEndPunct = /[.!?।,]$/.test(wordStr);
                if (chunk.length >= 6 || isEndPunct || idx === words.length - 1) {
                  out.push({
                    start: Number(chunk[0].start) || 0,
                    end: Number(chunk[chunk.length - 1].end) || 35,
                    text: chunk.map((c: any) => c.word || c.text).join(" ").trim(),
                  });
                  chunk = [];
                }
              });
              return out;
            }
            return [
              { start: 0, end: 8.5, text: "" },
              { start: 8.5, end: 18.0, text: "" },
              { start: 18.0, end: 27.0, text: "" },
              { start: 27.0, end: 35.0, text: "" },
            ];
          }

          const CameraRig: React.FC<{ frame: number; fps: number; beatIndex: number; beatStartFrame: number; act: number }> = ({ frame, fps, beatIndex, beatStartFrame, act }) => {
            const { camera } = useThree();
            useFrame(() => {
              const beatPop = spring({ frame: frame - beatStartFrame, fps, config: { damping: 14, stiffness: 120 } });
              const punchZ = interpolate(beatPop, [0, 1], [0.85, 0]);
              const altDir = beatIndex % 2 === 0 ? 1 : -1;

              let cx = 0, cy = 2.4, cz = 9.0;
              let tx = 0, ty = 1.2, tz = -2.0;

              if (act === 1) {
                const p = frame / 240;
                cx = interpolate(p, [0, 1], [-4.2, 3.6]) + altDir * 0.4;
                cy = interpolate(p, [0, 1], [5.2, 2.1]);
                cz = interpolate(p, [0, 1], [11.8, 7.6]) + punchZ;
                tx = interpolate(p, [0, 1], [-1.8, 2.2]);
                ty = 1.25;
                tz = -2.2;
              } else if (act === 2) {
                const p = (frame - 240) / 300;
                const shake = (frame % 4 < 2) ? 0.16 : -0.16;
                cx = interpolate(p, [0, 1], [-3.8, -2.2]) + shake;
                cy = 2.0 + Math.abs(shake) * 0.4;
                cz = interpolate(p, [0, 1], [7.2, 5.6]) + punchZ;
                tx = 2.0;
                ty = 1.3;
                tz = -2.6;
              } else if (act === 3) {
                const p = (frame - 540) / 270;
                cx = interpolate(p, [0, 1], [-5.2, 5.2]);
                cy = 1.6 + Math.sin(frame * 0.25) * 0.08;
                cz = 7.0 + punchZ;
                tx = cx + 1.1;
                ty = 1.2;
                tz = -2.2;
              } else {
                const p = (frame - 810) / 240;
                const angle = interpolate(p, [0, 1], [-0.32, 0.42]);
                const radius = interpolate(p, [0, 1], [8.0, 11.2]) + punchZ;
                cx = Math.sin(angle) * radius;
                cy = interpolate(p, [0, 1], [2.1, 3.8]);
                cz = Math.cos(angle) * radius;
                tx = 0.4;
                ty = 1.25;
                tz = -1.8;
              }

              camera.position.set(cx, cy, cz);
              camera.lookAt(tx, ty, tz);
            });
            return null;
          };

          const WheatField3D: React.FC<{ frame: number }> = ({ frame }) => {
            const meshRef = useRef<THREE.InstancedMesh>(null);
            const count = 240;
            const dummy = useMemo(() => new THREE.Object3D(), []);
            const stalks = useMemo(() => Array.from({ length: count }, (_, i) => ({
              x: ((i * 97) % 240) / 10 - 12,
              z: -((i * 53) % 200) / 10 + 4,
              h: 0.95 + (i % 5) * 0.24,
              phase: i * 0.4
            })), []);

            useEffect(() => {
              if (!meshRef.current) return;
              stalks.forEach((s, i) => {
                dummy.position.set(s.x, s.h * 0.5, s.z);
                dummy.rotation.z = Math.sin(frame * 0.1 + s.phase) * 0.24;
                dummy.scale.set(0.09, s.h, 0.09);
                dummy.updateMatrix();
                meshRef.current!.setMatrixAt(i, dummy.matrix);
              });
              meshRef.current.instanceMatrix.needsUpdate = true;
            }, [frame, dummy, stalks]);

            return (
              <instancedMesh ref={meshRef} args={[undefined, undefined, count]}>
                <coneGeometry args={[0.5, 1, 4]} />
                <meshToonMaterial color="#f2c44e" />
              </instancedMesh>
            );
          };

          const CharacterBillboard: React.FC<{ texture: THREE.Texture; position: [number, number, number]; scale?: number; flipX?: boolean }> = ({ texture, position, scale = 3.4, flipX = false }) => {
            const meshRef = useRef<THREE.Mesh>(null);
            useFrame(({ camera }) => {
              if (meshRef.current) {
                meshRef.current.quaternion.copy(camera.quaternion);
              }
            });
            return (
              <mesh ref={meshRef} position={position} scale={[flipX ? -scale : scale, scale, 1]}>
                <planeGeometry args={[1, 1]} />
                <meshBasicMaterial map={texture} transparent alphaTest={0.05} side={THREE.DoubleSide} />
              </mesh>
            );
          };

          export const EmuWar: React.FC = () => {
            const frame = useCurrentFrame();
            const { width, height, fps } = useVideoConfig();
            const tSec = frame / fps;

            const beatSegments = useMemo(() => extractBeatSegments(rawTimings), []);
            const activeBeatIdx = useMemo(() => {
              const idx = beatSegments.findIndex((s) => tSec >= s.start && tSec <= s.end);
              return idx >= 0 ? idx : Math.min(beatSegments.length - 1, Math.floor((tSec / 35) * beatSegments.length));
            }, [beatSegments, tSec]);
            const activeBeat = beatSegments[activeBeatIdx] || { start: 0, end: 35, text: "" };
            const beatStartFrame = Math.floor(activeBeat.start * fps);

            const act = frame < 240 ? 1 : frame < 540 ? 2 : frame < 810 ? 3 : 4;

            const assets = useMemo(() => ({
              dayBg: createPaintedBackdrop(false),
              sunsetBg: createPaintedBackdrop(true),
              emuRun: Array.from({ length: 8 }, (_, s) => createEmuTexture(s, "run")),
              emuPanic: Array.from({ length: 8 }, (_, s) => createEmuTexture(s, "panic")),
              emuSmug: Array.from({ length: 8 }, (_, s) => createEmuTexture(s, "smug")),
              soldierAim: Array.from({ length: 8 }, (_, s) => createSoldierTexture(s, "aim")),
              soldierFire: Array.from({ length: 8 }, (_, s) => createSoldierTexture(s, "fire")),
              soldierRetreat: Array.from({ length: 8 }, (_, s) => createSoldierTexture(s, "retreat")),
            }), []);

            const stepA = Math.floor(frame / 2) % 8;
            const stepB = (stepA + 4) % 8;

            const emuTexA = act === 2 ? assets.emuPanic[stepA] : act === 4 ? assets.emuSmug[stepA] : assets.emuRun[stepA];
            const emuTexB = act === 2 ? assets.emuPanic[stepB] : act === 4 ? assets.emuSmug[stepB] : assets.emuRun[stepB];
            const soldierTex = act === 4 ? assets.soldierRetreat[stepA] : (act === 2 && activeBeatIdx % 2 === 1) ? assets.soldierFire[stepA] : act === 2 ? assets.soldierFire[stepA] : assets.soldierAim[stepA];

            const emuX1 = interpolate(frame % 150, [0, 150], [-7.5, 7.5]);
            const emuSplitZ = act === 3 ? interpolate(frame, [540, 810], [-1.8, -7.2]) : -2.0;
            const emuSplitZ2 = act === 3 ? interpolate(frame, [540, 810], [-1.2, 2.6]) : -0.6;
            const retreatX = act === 4 ? interpolate(frame, [810, 1050], [-2.0, -9.8]) : -2.5;

            return (
              <AbsoluteFill style={{ backgroundColor: act === 4 ? "#d96b43" : "#1d5fa3" }}>
                <ThreeCanvas width={width} height={height} camera={{ fov: 44, near: 0.1, far: 100 }}>
                  <CameraRig frame={frame} fps={fps} beatIndex={activeBeatIdx} beatStartFrame={beatStartFrame} act={act} />
                  <fog attach="fog" args={[act === 4 ? "#f7b267" : "#bfe3ff", 11, 34]} />
                  <ambientLight intensity={0.9} color="#fff7e6" />
                  <directionalLight position={[8, 14, 6]} intensity={1.6} color="#ffe9b3" />

                  {/* Painted Sky & Mountain Backdrop Plane */}
                  <mesh position={[0, 7.5, -24]}>
                    <planeGeometry args={[56, 26]} />
                    <meshBasicMaterial map={act === 4 ? assets.sunsetBg : assets.dayBg} />
                  </mesh>

                  {/* 3D Golden Terrain */}
                  <mesh rotation={[-Math.PI / 2, 0, 0]} position={[0, 0, -4]}>
                    <planeGeometry args={[60, 60]} />
                    <meshToonMaterial color="#c98e2b" />
                  </mesh>

                  {/* 3D Wooden Fence Posts */}
                  {[-6, -3, 0, 3, 6].map((fx, i) => (
                    <group key={i} position={[fx, 0.75, -5.5]}>
                      <mesh>
                        <boxGeometry args={[0.18, 1.5, 0.18]} />
                        <meshToonMaterial color="#5e3c24" />
                      </mesh>
                      <mesh position={[1.5, 0.25, 0]}>
                        <boxGeometry args={[3.0, 0.12, 0.1]} />
                        <meshToonMaterial color="#70482b" />
                      </mesh>
                    </group>
                  ))}

                  <WheatField3D frame={frame} />

                  {/* Act 1: Emu Herd Invading */}
                  {act === 1 && (
                    <>
                      <CharacterBillboard texture={emuTexA} position={[emuX1, 1.65, -2.0]} scale={3.5} />
                      <CharacterBillboard texture={emuTexB} position={[emuX1 - 2.4, 1.6, -3.5]} scale={3.3} />
                      <CharacterBillboard texture={emuTexA} position={[emuX1 - 4.4, 1.7, -0.8]} scale={3.7} />
                    </>
                  )}

                  {/* Act 2: Royal Artillery Lewis Gun Ambush */}
                  {act === 2 && (
                    <>
                      <CharacterBillboard texture={soldierTex} position={[-2.5, 1.65, 1.2]} scale={3.6} />
                      <CharacterBillboard texture={soldierTex} position={[-1.2, 1.65, -1.2]} scale={3.4} />
                      <CharacterBillboard texture={emuTexA} position={[3.5, 1.65, -1.5]} scale={3.5} flipX />
                      <CharacterBillboard texture={emuTexB} position={[5.1, 1.65, -3.4]} scale={3.4} flipX />
                    </>
                  )}

                  {/* Act 3: Guerrilla Split Tactics */}
                  {act === 3 && (
                    <>
                      <CharacterBillboard texture={emuTexA} position={[emuX1, 1.65, emuSplitZ]} scale={3.4} />
                      <CharacterBillboard texture={emuTexB} position={[emuX1 - 2.0, 1.65, emuSplitZ2]} scale={3.7} />
                      <CharacterBillboard texture={emuTexA} position={[emuX1 - 3.8, 1.65, -2.4]} scale={3.5} />
                    </>
                  )}

                  {/* Act 4: Army Retreats, Emus Triumph */}
                  {act === 4 && (
                    <>
                      <CharacterBillboard texture={soldierTex} position={[retreatX, 1.65, 0.5]} scale={3.5} />
                      <CharacterBillboard texture={emuTexA} position={[2.0, 1.7, -1.2]} scale={3.7} flipX />
                      <CharacterBillboard texture={emuTexB} position={[4.0, 1.7, -2.8]} scale={3.6} flipX />
                    </>
                  )}
                </ThreeCanvas>

                {/* Clean Beat-Synced Subtitles from JSON */}
                {activeBeat.text && (
                  <div style={{ position: "absolute", bottom: 200, width: "100%", textAlign: "center", padding: "0 48px", fontFamily: "sans-serif" }}>
                    <span style={{ background: "rgba(36, 23, 38, 0.88)", color: "#ffffff", padding: "14px 28px", borderRadius: 18, fontSize: 40, fontWeight: 900, lineHeight: 1.4, boxShadow: "0 6px 20px rgba(0,0,0,0.45)" }}>
                      {activeBeat.text}
                    </span>
                  </div>
                )}

                <Audio src={staticFile("voice.mp3")} />
              </AbsoluteFill>
            );
          };
          EOF

      - name: Render Video
        run: npx remotion render src/index.ts EmuWar final_emu_war.mp4 --gl=swiftshader --concurrency=2 --crf=23
      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: final-emu-war-video
          path: final_emu_war.mp4
